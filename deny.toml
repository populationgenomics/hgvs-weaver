# Supply-chain policy, enforced in CI by `cargo deny check`.
#
# The advisories check is the point: it fails the build when any crate in the
# graph — direct or transitive — matches a RUSTSEC advisory. `bans.deny` is a
# tripwire for names that are known-malicious rather than merely vulnerable;
# an advisory can be withdrawn or lag publication, a banned name cannot enter
# the graph at all.

[graph]
all-features = true

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"

unmaintained = "all"

[bans]
multiple-versions = "warn"
wildcards = "deny"

# Confirmed-malicious crates, banned by name so any version trips the check.
deny = [
    # RUSTSEC-2026-0260: pulled in by a malicious arrayref 0.3.10; the payload
    # ran from its build script. Typosquat of proc-macro2.
    { name = "proc-macro1" },
    # RUSTSEC-2022-0071: typosquat of rust_decimal, shipped a payload.
    { name = "rustdecimal" },
    # 2025 crates.io campaign: credential stealers posing as logging crates.
    { name = "faster_log" },
    { name = "async_println" },
]

# Exactly the licenses present in the graph today. A dependency introducing
# any other license fails the check, which is the intent: a new license is a
# deliberate review, not a silent adoption.
[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "Unicode-3.0",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
