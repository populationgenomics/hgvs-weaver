default_language_version:
  python: python3.12
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        exclude: '\.*conda/.*'
      - id: end-of-file-fixer
      - id: trailing-whitespace
        exclude: '\.txt$|\.tsv$'
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: detect-private-key
      - id: debug-statements
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.14.1
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: local
    hooks:
      # pyright needs the project's dependencies to resolve imports, so it runs in the uv env.
      # Whole-project (pass_filenames: false); fires on any staged .py.
      - id: pyright
        name: pyright
        entry: uv run --no-sync pyright
        language: system
        files: \.py$
        pass_filenames: false
  - repo: local
    hooks:
      # Rust's mechanical layer, both crates; whole-project, fires on any staged Rust or Cargo file.
      - id: cargo-fmt
        name: cargo fmt
        entry: bash -c 'cargo fmt --check && cargo fmt --check --manifest-path hgvs-weaver/Cargo.toml'
        language: system
        files: \.rs$|Cargo\.(toml|lock)$
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy
        entry: bash -c 'cargo clippy --locked --all-targets -- -D warnings && cargo clippy --locked --all-targets --manifest-path hgvs-weaver/Cargo.toml -- -D warnings'
        language: system
        files: \.rs$|Cargo\.(toml|lock)$
        pass_filenames: false
  # Markdown formatter. CommonMark-strict, so intraword `_` (snake_case) stays literal and fenced
  # code is untouched. gfm = tables/task-lists/autolinks; frontmatter = YAML headers. Wrap at 120.
  - repo: https://github.com/hukkin/mdformat
    rev: 1.0.0
    hooks:
      - id: mdformat
        args: ["--wrap", "120"]
        additional_dependencies:
          - mdformat-gfm==1.0.0
          - mdformat-frontmatter==2.1.2
  - repo: https://github.com/google/yamlfmt
    rev: v0.21.0
    hooks:
      - id: yamlfmt
