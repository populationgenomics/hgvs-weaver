name: Lint

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  pre-commit:
    # Every hook in .pre-commit-config.yaml: the whole static-check gate.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      # rustup ships on every GitHub runner image; actions-rs/toolchain was
      # archived in 2023 and an unmaintained action is a takeover vector.
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable

      # Everything but the project itself, from the lock: no hook imports weaver, and pyright reads the
      # extension's stub. The gate group and the extras are there so pyright resolves every import.
      - name: Install the dev and gate groups and the extras
        run: uv sync --locked --group dev --group gate --all-extras --no-install-project --python 3.12

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit
        run: uv run --no-sync pre-commit run --all-files --show-diff-on-failure
