name: Release

on:
  release:
    types: [created]

permissions:
  contents: read

jobs:
  check_version:
    # The tag is the release's name; the wheel's and the crates' versions come from their manifests.
    # They must agree, or PyPI and crates.io show one version and the repository another.
    name: Tag matches the versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Check the tag against pyproject.toml and both Cargo.toml files
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          python_version="$(uv version --short)"
          binding_version="$(sed -nE 's/^version = "(.*)"/\1/p' Cargo.toml | head -1)"
          core_version="$(sed -nE 's/^version = "(.*)"/\1/p' hgvs-weaver/Cargo.toml | head -1)"
          for version in "$python_version" "$binding_version" "$core_version"; do
            if [ "v${version}" != "${TAG}" ]; then
              echo "::error::tag ${TAG} does not match a version: pyproject ${python_version}, binding crate ${binding_version}, core crate ${core_version}"
              exit 1
            fi
          done

  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    needs: check_version
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Set up QEMU
        if: matrix.os == 'ubuntu-latest'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          platforms: all

      # rustup ships on every GitHub runner image; actions-rs/toolchain was
      # archived in 2023 and an unmaintained action is a takeover vector.
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Add macos target
        if: matrix.os == 'macos-latest'
        run: rustup target add x86_64-apple-darwin

      - name: Install dependencies
        run: pip install "cibuildwheel==2.23.4"

      - name: Build wheels
        run: cibuildwheel --output-dir wheelhouse

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build sdist
    needs: check_version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install maturin
        run: pip install "maturin==1.14.1"
      - name: Build sdist
        run: maturin sdist --out dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdist
          path: dist

  upload_release_assets:
    name: Upload Assets to Release
    runs-on: ubuntu-latest
    needs: [build_wheels, build_sdist]
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true
      - name: Upload Wheels and sdist
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: artifacts/*
          overwrite_files: true

  publish-to-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build_wheels, build_sdist]
    environment:
      name: pypi
      url: https://pypi.org/p/hgvs-weaver
    permissions:
      id-token: write # Required for trusted publishing
    steps:
      - name: Download all wheels and sdist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  publish-to-crates-io:
    name: Publish to crates.io
    needs: check_version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # rustup ships on every GitHub runner image; actions-rs/toolchain was
      # archived in 2023 and an unmaintained action is a takeover vector.
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Publish
        run: |-
          cd hgvs-weaver
          cargo publish --locked --token ${{ secrets.CRATES_IO_TOKEN }}
