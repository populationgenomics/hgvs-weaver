name: CI Test Build

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test_build:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      CIBW_ARCHS_LINUX: x86_64
      # maturin invokes cargo inside cibuildwheel, so --locked has to reach it
      # through the build environment; without it the wheel build re-resolves
      # the graph and ignores the committed Cargo.lock.
      CIBW_ENVIRONMENT: MATURIN_PEP517_ARGS="--locked"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      # rustup ships on every GitHub runner image; actions-rs/toolchain was
      # archived in 2023 and an unmaintained action is a takeover vector.
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Add macos target
        if: matrix.os == 'macos-latest'
        run: rustup target add x86_64-apple-darwin

      - name: Install dependencies
        run: pip install "cibuildwheel==2.23.4"

      - name: Build wheels for testing
        run: cibuildwheel --output-dir wheelhouse
