[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "hgvs-weaver"
version = "0.7.0"
description = "High-performance HGVS parser for Python (Rust powered)"
dependencies = [
    "defusedxml>=0.7.1",
    "maturin>=1.11.5",
]
requires-python = ">=3.10"

[project.optional-dependencies]
validation = [
    # 0.1.2 is the first whose plain install is the local-store reader alone, without the GCS client.
    "hgvs-weaver-data>=0.1.2; python_version >= '3.12'",
    "pysam",
    "tqdm",
    "parsley",
    "bioutils",
    "seaborn",
    "matplotlib",
    "pandas",
]

[project.scripts]
weaver-validate = "weaver.cli.validate:main"
weaver-analyze = "weaver.cli.analyze:main"
weaver-categorize = "weaver.cli.categorize:main"
weaver-contingency = "weaver.cli.contingency:main"
weaver-extract = "weaver.cli.extract:main"
weaver-gate = "weaver.cli.gate:main"

[dependency-groups]
# The ClinVar gate: `uv run --group gate weaver-gate`. hgvs-weaver-data needs Python 3.12, so the group does too.
gate = [
    # Exact-pinned because it is exempt from the age gate below; a bump is a reviewed edit.
    "hgvs-weaver-data[build]==0.1.3",
    "hgvs>=1.5",
    "tqdm",
    "parsley",
    "bioutils",
]
dev = [
    # The Python suite imports the biocommons adapter, so hgvs is a test dependency; its database driver,
    # sequence repository and shell are overridden out below.
    "hgvs>=1.5",
    "maturin>=1.11.5",
    "myst-parser",
    "pre-commit",
    "pyright>=1.1.400",
    "pytest>=8.4.1",
    "pytest-cov>=7.0.0",
    "ruff",
    "sphinx",
    "sphinx-rtd-theme",
    "twine",
]

[tool.uv.dependency-groups]
gate = { requires-python = ">=3.12" }

# Supply-chain age gate: never resolve a release younger than 7 days. Declared in the repo, not only in a
# global uv config, so CI and contributors inherit the same resolution: a global-only gate makes the lock
# unreproducible, since uv detects the missing setting off-machine and `--locked` fails. Relative, not a
# fixed date: the intent is an ongoing "nothing younger than 7 days", not a frozen cutoff. A local relock
# rolls back a committed version younger than the window; it self-heals as the version ages past it.
[tool.uv]
exclude-newer = "7 days"
# hgvs-weaver-data is first-party: we cut its releases, so the window the gate guards against (a compromised
# third-party upload) does not apply, and a just-cut release is resolvable at once. Removing the cushion is
# paired with the exact pin in the gate group above: with no cushion, the pin is what stops a relock from
# silently adopting a new release; anything exempted here must be exact-pinned there.
exclude-newer-package = { hgvs-weaver-data = "0 days" }
# hgvs's own dependencies the validation never reaches: a database driver that needs a C library to build,
# a sequence repository, and a shell. Removed from the resolution rather than installed for nothing.
override-dependencies = [
    "psycopg2; sys_platform == 'never'",
    "biocommons.seqrepo; sys_platform == 'never'",
    "ipython; sys_platform == 'never'",
]

[tool.maturin]
features = ["pyo3/extension-module"]
manifest-path = "./Cargo.toml"
python-source = "./"
module-name = "weaver._weaver"

[tool.ruff]
line-length = 120
target-version = "py311"
indent-width = 4

[tool.ruff.lint]
# TCH (flake8-type-checking) is left out on purpose: it moves type-only imports into TYPE_CHECKING
# blocks, which docs/style/python.md rules out; with `from __future__ import annotations` the import
# costs nothing at run time.
select = ["A", "B", "C",  "E", "F", "G", "I", "N", "Q", "S", "W", "ANN", "ARG", "BLE", "COM", "DJ", "DTZ", "ERA", "EXE", "ICN", "ISC", "NPY", "PD", "PGH", "PIE", "PL", "PT", "PYI", "RET", "RSE", "RUF", "SIM", "SLF", "TID", "UP", "YTT"]
ignore = [
    "PD011",   # pandas-use-of-dot-values (false positive)
]
fixable = ["A", "B", "C", "D", "E", "F", "G", "I", "N", "Q", "S", "T", "W", "ANN", "ARG", "BLE", "COM", "DJ", "DTZ", "ERA", "EXE", "FBT", "ICN", "ISC", "NPY", "PD", "PGH", "PIE", "PL", "PT", "PYI", "RET", "RSE", "RUF", "SIM", "SLF", "TID", "UP", "YTT"]

[tool.ruff.lint.flake8-tidy-imports]
# Absolute imports only (docs/style/python.md).
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["weaver"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",     # asserts.
    "S102",     # exec().
    "PLR2004",  # magic value comparisons.
    "SLF001",   # private method access.
]
"weaver/cli/*" = [
    "BLE001",   # blind except.
    "G004",     # logging f-strings.
    "PLR0911",  # too many return statements.
    "PLR0912",  # too many branches.
    "PLR0915",  # too many statements.
    "PLR2004",  # magic values.
    "C901",     # complexity.
    "E501",     # line length.
    "PLW0603",  # global statement.
    "ANN401",   # Any type.
]
"hgvs-weaver/tests/*" = [
    "S101",
    "ANN401",
]
"docs/*" = [
    "A001"
]
"weaver/_weaver.pyi" = [
    "ANN401",   # Any in stubs.
    "A002",     # Shadowing builtin.
    "PYI021",   # Docstrings in stubs.
]

[tool.pyright]
# The Python the tooling targets (ruff's target-version); the annotations are checked against its standard library.
pythonVersion = "3.11"
# Resolve imports from the uv-managed venv, so editor pyright sees installed deps the same way `uv run pyright` does.
venvPath = "."
venv = ".venv"
include = ["weaver", "tests", "scripts", "tools"]
exclude = ["**/__pycache__", ".venv"]
typeCheckingMode = "standard"

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-*"
skip = "*-musllinux*"
# maturin invokes cargo inside cibuildwheel, so --locked has to reach it
# through the build environment; without it the wheel is built from a freshly
# resolved graph, not the committed Cargo.lock.
environment = { MATURIN_PEP517_ARGS = "--locked" }

[tool.cibuildwheel.linux]
archs = ["x86_64", "aarch64"]

[tool.cibuildwheel.macos]
archs = ["x86_64", "arm64"]

# The oldest macOS each architecture's wheel can run on. Left unset, the
# x86_64 wheel is tagged 10.9 and delocate refuses the Rust library's higher
# minimum; set below these, cibuildwheel raises it and warns on every build.
[[tool.cibuildwheel.overrides]]
select = "*-macosx_x86_64"
environment = { MATURIN_PEP517_ARGS = "--locked", MACOSX_DEPLOYMENT_TARGET = "10.13" }

[[tool.cibuildwheel.overrides]]
select = "*-macosx_arm64"
environment = { MATURIN_PEP517_ARGS = "--locked", MACOSX_DEPLOYMENT_TARGET = "11.0" }

[tool.cibuildwheel.windows]
archs = ["AMD64"]
